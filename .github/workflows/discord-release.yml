# Post each published firmware release to Discord.
#
# Needs the repository secret DISCORD_FIRMWARE_WEBHOOK (a Discord channel
# webhook URL). Without it the job logs a notice and exits cleanly.
#
# Runs automatically when a release is published. To (re)post an existing
# release by hand: Actions -> "Announce release on Discord" -> Run workflow,
# and enter its tag (leave empty for the latest release).
name: Announce release on Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post (empty = latest)
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_FIRMWARE_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DISCORD_FIRMWARE_WEBHOOK is not set; skipping."
            exit 0
          fi
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -n "$tag" ]; then
            gh api "repos/$REPO/releases/tags/$tag" > release.json
          else
            gh api "repos/$REPO/releases/latest" > release.json
          fi
          name=$(jq -r '.name // .tag_name' release.json)
          url=$(jq -r '.html_url' release.json)
          # Discord doesn't render tables, so post only the "What's changed"
          # section (up to the file table), capped to the embed limit.
          changes=$(jq -r '.body' release.json | tr -d '\r' | awk '
            /^## What.s changed/ {on=1; next}
            on && /^\|/ {exit}
            on {print}' | head -c 3800)
          jq -n --arg name "$name" --arg url "$url" --arg desc "$changes" '{
            content: "New Imprint firmware is out.",
            embeds: [{
              title: $name,
              url: $url,
              description: ($desc + "\n\n**Download and install:** " + $url),
              color: 5793266
            }]
          }' > payload.json
          curl --fail-with-body -sS -H 'Content-Type: application/json' \
            -d @payload.json "$WEBHOOK"
